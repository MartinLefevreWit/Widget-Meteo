
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Widget Météo – OpenWeather</title>
<style>
  html, body { margin:0; padding:0; background:#0f172a; color:#e5e7eb; font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; }
  .wrapper { display:grid; place-items:center; min-height:100vh; }
  .widget { width:100%; max-width:380px; border-radius:14px; background:rgba(15,23,42,0.85); border:1px solid #1f2937; box-shadow:0 10px 25px rgba(0,0,0,.35); backdrop-filter:blur(6px); }
  .header { display:flex; justify-content:space-between; padding:14px 16px; background:rgba(56,189,248,.08); }
  .city { font-weight:600; }
  .updated { font-size:12px; color:#9ca3af; }
  .main { display:grid; grid-template-columns:1fr auto; gap:12px; padding:16px; }
  .temp { font-size:42px; font-weight:700; }
  .desc { color:#9ca3af; text-transform:capitalize; }
  .icon { width:72px; height:72px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px 16px; }
  .card { background:#111827; border-radius:12px; padding:12px; text-align:center; }
  .label { font-size:12px; color:#9ca3af; margin-bottom:6px; }
  .value { font-weight:600; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrapper">
  <div class="widget">
    <div class="header">
      <div class="city" id="city">Nice, FR</div>
      <div class="updated" id="updated">—</div>
    </div>
    <div class="main">
      <div>
        <div class="temp" id="temp">--°C</div>
        <div class="desc" id="desc">—</div>
      </div>
      <img class="icon" id="icon" alt="Icône météo" />
    </div>
    <div class="grid">
      <div class="card"><div class="label">Vent</div><div class="value" id="wind">—</div></div>
      <div class="card"><div class="label">Humidité</div><div class="value" id="humidity">—</div></div>
      <div class="card"><div class="label">Pression</div><div class="value" id="pressure">—</div></div>
    </div>
  </div>
</div>

<script>
const API_KEY = "f5f9a18a44029213156c7571d5b0d3f0"; // Mets ta clé OpenWeather ici
const LAT = 43.7009, LON = 7.2683;
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Animation pluie
let drops = [];
function initRain() {
  drops = [];
  for(let i=0;i<150;i++){
    drops.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,length:10,speed:4+Math.random()*4});
  }
}
function drawRain() {
  ctx.strokeStyle='#00BFFF';
  ctx.lineWidth=1;
  for(let d of drops){
    ctx.beginPath();
    ctx.moveTo(d.x,d.y);
    ctx.lineTo(d.x,d.y+d.length);
    ctx.stroke();
    d.y+=d.speed;
    if(d.y>canvas.height){ d.y=0; d.x=Math.random()*canvas.width; }
  }
}

function drawScene(condition) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(condition.includes('Clear')) {
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/3, 80, 0, Math.PI*2);
    ctx.fillStyle = '#FFD700';
    ctx.fill();
  } else if(condition.includes('Cloud')) {
    ctx.fillStyle = '#708090';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(100+i*150,150,50,0,Math.PI*2);
      ctx.fillStyle='#D3D3D3';
      ctx.fill();
    }
  } else if(condition.includes('Rain')) {
    ctx.fillStyle = '#2F4F4F';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    initRain();
    function animateRain(){
      ctx.fillStyle='#2F4F4F';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawRain();
      requestAnimationFrame(animateRain);
    }
    animateRain();
  }
}

async function getWeather(){
  const url=`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&units=metric&lang=fr&appid=${API_KEY}`;
  const res=await fetch(url);
  const data=await res.json();
  if(data.cod!==200){ alert("Erreur API : "+data.message); return; }
  document.getElementById('temp').textContent=`${Math.round(data.main.temp)}°C`;
  document.getElementById('desc').textContent=data.weather[0].description;
  document.getElementById('wind').textContent=`${Math.round(data.wind.speed*3.6)} km/h`;
  document.getElementById('humidity').textContent=`${data.main.humidity}%`;
  document.getElementById('pressure').textContent=`${data.main.pressure} hPa`;
  document.getElementById('icon').src=`https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
  document.getElementById('updated').textContent=`Maj ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
  drawScene(data.weather[0].main);
}

getWeather();
</script>
</body>
</html>
