
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Widget Météo – OpenWeather (fond animé)</title>
<style>
  html, body {
    margin:0; padding:0;
    /* Laisse un fond de secours, mais le canvas passera AU-DESSUS */
    background:#0f172a; color:#e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", sans-serif;
    overflow:hidden;
  }
  /* Canvas au-dessus du fond de page, derrière le widget */
  canvas {
    position:fixed; top:0; left:0;
    width:100vw; height:100vh;
    z-index:0;           /* ⚠️ plus de -1 */
    pointer-events:none; /* ne bloque pas les clics */
  }
  .wrapper {
    display:grid; place-items:center;
    min-height:100vh; position:relative; z-index:1; /* le widget est au-dessus du canvas */
  }
  .widget {
    width:100%; max-width:380px;
    border-radius:14px;
    background:rgba(15,23,42,0.85);
    border:1px solid #1f2937;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    overflow:hidden;
    backdrop-filter: blur(6px);
  }
  .header { display:flex; justify-content:space-between; padding:14px 16px; background:rgba(56,189,248,.08); }
  .city { font-weight:600; }
  .updated { font-size:12px; color:#9ca3af; }
  .main { display:grid; grid-template-columns:1fr auto; gap:12px; padding:16px; }
  .temp { font-size:42px; font-weight:700; }
  .desc { color:#9ca3af; text-transform:capitalize; }
  .icon { width:72px; height:72px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px 16px; }
  .card { background:#111827; border-radius:12px; padding:12px; text-align:center; }
  .label { font-size:12px; color:#9ca3af; margin-bottom:6px; }
  .value { font-weight:600; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrapper">
  <div class="widget" role="region" aria-label="Widget météo">
    <div class="header">
      <div class="city" id="city">Nice, FR</div>
      <div class="updated" id="updated">—</div>
    </div>

    <div class="main">
      <div>
        <div class="temp" id="temp">--°C</div>
        <div class="desc" id="desc">—</div>
      </div>
      <img class="icon" id="icon" alt="Icône météo" />
    </div>

    <div class="grid" aria-label="Détails météo">
      <div class="card"><div class="label">Vent</div><div class="value" id="wind">—</div></div>
      <div class="card"><div class="label">Humidité</div><div class="value" id="humidity">—</div></div>
      <div class="card"><div class="label">Pression</div><div class="value" id="pressure">—</div></div>
    </div>
  </div>
</div>

<script>
// ================== CONFIG ==================
const API_KEY = "f5f9a18a44029213156c7571d5b0d3f0";               // <-- ta clé OpenWeather (clé seule)
const LAT = 43.7009, LON = 7.2683;          // Nice
const W_ICON = (i) => `https://openweathermap.org/img/wn/${i}@2x.png`;

// ================== CANVAS SETUP ==================
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ================== ANIM STATE ==================
let anim = { type: 'none', t: 0, clouds: [], rain: [] };

// ---- Nuages en mouvement ----
function initClouds(count=8){
  anim.clouds = [];
  const H = canvas.height;
  for (let i=0;i<count;i++){
    anim.clouds.push({
      x: Math.random()*canvas.width,
      y: 50 + Math.random()*(H*0.5),
      r: 40 + Math.random()*60,          // taille
      vx: 0.2 + Math.random()*0.6        // vitesse horizontale
    });
  }
}
function drawCloud(c){
  // petit cumulus : 3 cercles
  ctx.fillStyle = 'rgba(220,220,220,0.95)';
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(c.x + c.r*0.8, c.y + c.r*0.2, c.r*0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(c.x - c.r*0.7, c.y + c.r*0.3, c.r*0.6, 0, Math.PI*2); ctx.fill();
}

// ---- Pluie ----
function initRain(count=160){
  anim.rain = [];
  for (let i=0;i<count;i++){
    anim.rain.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      len: 8 + Math.random()*12,
      vy: 4 + Math.random()*5
    });
  }
}
function drawRain(){
  ctx.strokeStyle = '#00BFFF';
  ctx.lineWidth = 1;
  for (const d of anim.rain){
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x, d.y + d.len);
    ctx.stroke();
    d.y += d.vy;
    if (d.y > canvas.height) { d.y = -d.len; d.x = Math.random()*canvas.width; }
  }
}

// ---- Soleil ----
function drawSun(){
  // ciel bleu
  const g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0, '#7ec8ff');   // bleu clair
  g.addColorStop(1, '#89b6ff');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // soleil + halo léger animé
  const cx = canvas.width*0.75;
  const cy = canvas.height*0.25;
  const r  = 80;

  // halo
  const halo = ctx.createRadialGradient(cx, cy, r*0.7, cx, cy, r*1.8);
  halo.addColorStop(0, 'rgba(255,215,0,0.35)');
  halo.addColorStop(1, 'rgba(255,215,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, r*1.8 + Math.sin(anim.t*0.02)*8, 0, Math.PI*2);
  ctx.fill();

  // disque
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();
}

// ---- Scène selon météo ----
function setScene(kind){
  anim.type = kind;
  if (kind === 'clear') {
    // rien à initialiser
  } else if (kind === 'clouds') {
    initClouds();
  } else if (kind === 'rain' || kind === 'drizzle' || kind === 'thunder') {
    initRain();
  } else if (kind === 'snow') {
    // simple fond, (on pourrait dessiner des flocons)
  } else {
    // mist/other
  }
}

// ---- Boucle d'animation ----
function loop(){
  anim.t++;
  // fond neutre
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (anim.type === 'clear') {
    drawSun();
  } else if (anim.type === 'clouds') {
    // fond gris doux
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,'#738a9b');
    g.addColorStop(1,'#5c7180');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);

    // nuages qui se déplacent
    for (const c of anim.clouds){
      drawCloud(c);
      c.x += c.vx;
      if (c.x - c.r > canvas.width) c.x = -c.r;
    }
  } else if (anim.type === 'rain' || anim.type === 'drizzle' || anim.type === 'thunder') {
    // fond sombre
    ctx.fillStyle = '#2F4F4F';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    drawRain();
    if (anim.type === 'thunder' && (anim.t % 180) < 6) {
      // flash orageux très bref
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }
  } else if (anim.type === 'snow') {
    // fond froid
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,'#b9d6f2');
    g.addColorStop(1,'#8fb7e8');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
    // (flocons à ajouter si besoin)
  } else {
    // brouillard / autres
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,'#9ca3af');
    g.addColorStop(1,'#6b7280');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================== WIDGET ==================
function $(id){ return document.getElementById(id); }

async function getWeather(){
  const url = new URL("https://api.openweathermap.org/data/2.5/weather");
  url.searchParams.set("lat", LAT);
  url.searchParams.set("lon", LON);
  url.searchParams.set("units", "metric");
  url.searchParams.set("lang", "fr");
  url.searchParams.set("appid", API_KEY);

  const res = await fetch(url.toString(), { cache:'no-store' });
  const data = await res.json();
  if (data.cod !== 200) {
    alert("Erreur API : " + (data.message || "réponse invalide"));
    return;
  }

  const weather = data.weather?.[0] || {};
  const main    = weather.main || '';          // ex: "Clouds", "Rain", "Clear"...
  const desc    = weather.description || '—';

  $('city').textContent      = "Nice, FR";
  $('temp').textContent      = `${Math.round(data.main.temp)}°C`;
  $('desc').textContent      = desc;
  $('wind').textContent      = `${Math.round((data.wind.speed || 0)*3.6)} km/h`;
  $('humidity').textContent  = `${data.main.humidity}%`;
  $('pressure').textContent  = `${data.main.pressure} hPa`;
  $('icon').src              = W_ICON(weather.icon || '01d');
  $('icon').alt              = `Météo : ${desc}`;
  $('updated').textContent   = `Maj ${new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}`;

  // Choix de la scène animée
  const m = main.toLowerCase();
  if (m.includes('clear'))       setScene('clear');
  else if (m.includes('cloud'))  setScene('clouds');
  else if (m.includes('rain'))   setScene('rain');
  else if (m.includes('drizzle  else if (m.includes('drizzle'))setScene('drizzle');
  else if (m.includes('thunder'))setScene('thunder');
  else if (m.includes('snow'))   setScene('snow');
  else                           setScene('mist');  // haze/mist/fog/…
}

// Lancer
getWeather();
</script>
</body>
