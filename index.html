
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Widget Météo – Sélecteur de villes (Paris, Lyon, Marseille, Nice, Bordeaux)</title>
<style>
  html, body {
    margin:0; padding:0;
    background:#0f172a; color:#e5e7eb;
    font-family: system-ui, sans-serif;
    display:grid; place-items:center;
    min-height:100vh;
  }

  .widget {
    position: relative;
    width:100%; max-width:380px;
    border-radius:14px;
    background:rgba(15,23,42,0.85);
    border:1px solid #1f2937;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    overflow:hidden;
    backdrop-filter: blur(6px);
    box-sizing: border-box;
  }

  /* Barre de sélection de villes */
  .cities {
    display:flex; gap:8px; flex-wrap:wrap;
    padding:10px 12px;
    background:rgba(56,189,248,.08);
    border-bottom:1px solid #1f2937;
  }
  .chip {
    appearance:none; border:0; cursor:pointer;
    padding:6px 10px; border-radius:999px;
    background:rgba(255,255,255,0.10);
    color:#e5e7eb; font-size:13px; font-weight:600;
    transition:background .2s ease, transform .1s ease;
  }
  .chip:hover { background:rgba(255,255,255,0.18); }
  .chip.active { background:#22d3ee; color:#0f172a; }
  .chip:active { transform:scale(0.98); }

  /* Canvas couvre toute la tuile */
  .bg-canvas {
    position:absolute; inset:0; z-index:0;
    width:100%; height:100%; display:block;
    pointer-events:none;
    backface-visibility: hidden;
  }

  /* Contenu par-dessus */
  .header, .main, .grid { position: relative; z-index: 1; }

  .header {
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px;
    background:rgba(56,189,248,.08);
  }
  .city { font-weight:600; color:#1f2937; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
  .updated { font-size:12px; color:#1f2937; text-shadow:0 1px 2px rgba(0,0,0,0.3); }

  .main {
    display:grid; grid-template-columns:1fr auto; gap:12px;
    padding:16px; min-height:160px;
  }
  .temp {
    font-size:42px; font-weight:700; opacity:.95;
    color:#1f2937; text-shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  .desc {
    font-size:18px; font-weight:500; opacity:.95;
    color:#1f2937; text-shadow:0 1px 3px rgba(0,0,0,0.4);
    text-transform:capitalize;
  }
  .icon { width:72px; height:72px; }

  .grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    padding:0 16px 16px;
  }
  .card {
    background:rgba(17,24,39,.75);
    border-radius:12px; padding:12px; text-align:center;
  }
  .label { font-size:12px; color:#9ca3af; margin-bottom:6px; }
  .value { font-weight:700; color:#1f2937; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div class="widget" id="widget">
  <!-- Sélecteur de villes -->
  <div class="cities" id="cities">
    <button class="chip" data-city="paris">Paris</button>
    <button class="chip" data-city="lyon">Lyon</button>
    <button class="chip" data-city="marseille">Marseille</button>
    <button class="chip chip-default active" data-city="nice">Nice</button>
    <button class="chip" data-city="bordeaux">Bordeaux</button>
  </div>

  <!-- Canvas fond -->
  <canvas id="bg" class="bg-canvas"></canvas>

  <!-- En-tête -->
  <div class="header">
    <div class="city" id="city">Nice, FR</div>
    <div class="updated" id="updated">—</div>
  </div>

  <!-- Bloc principal -->
  <div class="main">
    <div>
      <div class="temp" id="temp">--°C</div>
      <div class="desc" id="desc">—</div>
    </div>
    <img class="icon" id="icon" alt="Icône météo" />
  </div>

  <!-- Infos -->
  <div class="grid">
    <div class="card"><div class="label">Vent</div><div class="value" id="wind">—</div></div>
    <div class="card"><div class="label">Humidité</div><div class="value" id="humidity">—</div></div>
    <div class="card"><div class="label">Pression</div><div class="value" id="pressure">—</div></div>
  </div>
</div>

<script>
/* ================== CONFIG ================== */
const API_KEY = "f5f9a18a44029213156c7571d5b0d3f0"; // ⚠️ Démo — ne pas exposer en prod
const W_ICON = (i) => `https://openweathermap.org/img/wn/${i}@2x.png`;

// Cartographie des villes → coordonnées
const CITY_COORDS = {
  paris:     { name: "Paris, FR",     lat: 48.8566, lon:  2.3522 },
  lyon:      { name: "Lyon, FR",      lat: 45.7640, lon:  4.8357 },
  marseille: { name: "Marseille, FR", lat: 43.2965, lon:  5.3698 },
  nice:      { name: "Nice, FR",      lat: 43.7009, lon:  7.2683 },
  bordeaux:  { name: "Bordeaux, FR",  lat: 44.8378, lon: -0.5792 }
};

// Ville courante (initialisée sur Nice ou depuis stockage)
let CURRENT = (() => {
  const savedKey = localStorage.getItem('cityKey');
  const key = savedKey && CITY_COORDS[savedKey] ? savedKey : 'nice';
  return { key, ...CITY_COORDS[key] };
})();

/* ================== CANVAS ================== */
const host = document.getElementById('widget');
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let cssW = 0, cssH = 0, dpr = 1;
function measureHost(){ cssW = host.clientWidth; cssH = host.clientHeight; dpr = window.devicePixelRatio || 1; }
function resizeCanvas(){
  measureHost();
  canvas.style.width = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width  = Math.ceil(cssW * dpr);
  canvas.height = Math.ceil(cssH * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(host);
window.addEventListener('resize', resizeCanvas);

/* ================== ANIM STATE ================== */
let anim = {
  type:'none',
  t:0,
  rain:[],
  snow:[],
  wind:{ speed:0, deg:0 }
};

/* ================== OUTILS ================== */
function $(id){ return document.getElementById(id); }
function paintSky(colorA='#89c7ea', colorB='#79b5d8'){
  const g = ctx.createLinearGradient(0,0,0,cssH);
  g.addColorStop(0, colorA);
  g.addColorStop(1, colorB);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,cssW,cssH);
}

/* ===== Nuages réalistes (version volumes doux) — résumée pour concision ===== */
/* -> garde ta version précédente si tu préfères ; ici on laisse simple */
function drawClouds(){
  // ciel nuageux doux “placeholder”: gradient + voile
  const g = ctx.createLinearGradient(0,0,0,cssH);
  g.addColorStop(0, 'rgba(255,255,255,0.35)');
  g.addColorStop(1, 'rgba(255,255,255,0.15)');
  ctx.fillStyle = g; ctx.fillRect(0,0,cssW,cssH);
}

/* ================== PLUIE ================== */
function initRain(count=110){
  anim.rain.length = 0;
  const mps = anim.wind.speed || 0;
  const ang = ((anim.wind.deg||0) * Math.PI)/180;
  const windVX = Math.cos(ang) * mps;

  count = Math.round(count * (cssW/380) * (cssH/220));
  for(let i=0;i<count;i++){
    const len = 8 + Math.random()*14;
    const speed = 3.8 + Math.random()*4.8 + mps*0.5;
    const alpha = 0.45 + Math.random()*0.4;
    anim.rain.push({
      x: Math.random()*cssW,
      y: Math.random()*cssH,
      len,
      vy: speed,
      vx: windVX*0.7 + (Math.random()-0.5)*0.5,
      alpha,
      width: 1 + Math.random()*0.7
    });
  }
}
function drawRain(){
  for(const d of anim.rain){
    ctx.strokeStyle = `rgba(160,200,255,${d.alpha})`;
    ctx.lineWidth   = d.width;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.vx*2, d.y + d.len);
    ctx.stroke();

    d.x += d.vx; d.y += d.vy;
    if(d.y > cssH || d.x < -20 || d.x > cssW+20){ d.y = -d.len; d.x = Math.random()*cssW; }
  }
}

/* ================== NEIGE ================== */
function initSnow(count=85){
  anim.snow.length = 0;
  count = Math.round(count * (cssW/380) * (cssH/220));
  for(let i=0;i<count;i++){
    const r  = 1.6 + Math.random()*3.2;
    const vy = 0.9 + Math.random()*1.6;
    const swayAmp = 8 + Math.random()*16;
    const swayFreq = 0.0018 + Math.random()*0.0035;
    const blur = Math.random() < 0.35 ? 2 : 0;

    anim.snow.push({
      x: Math.random()*cssW,
      y: Math.random()*cssH,
      r, vy,
      baseX: Math.random()*cssW,
      swayAmp, swayFreq, phase: Math.random()*Math.PI*2,
      blur,
      alpha: 0.6 + Math.random()*0.3
    });
  }
}
function drawSnow(){
  for(const f of anim.snow){
    f.phase += f.swayFreq * (1 + f.vy*0.08);
    f.x = f.baseX + Math.sin(f.phase) * f.swayAmp;

    ctx.shadowColor = `rgba(255,255,255,${f.alpha})`;
    ctx.shadowBlur  = f.blur;

    const gr = ctx.createRadialGradient(f.x, f.y, f.r*0.25, f.x, f.y, f.r);
    gr.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
    gr.addColorStop(1, `rgba(255,255,255,${Math.max(0.35, f.alpha-0.3)})`);
    ctx.fillStyle = gr;

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    f.y += f.vy;
    if(f.y > cssH){ f.y = -f.r; f.baseX = Math.random()*cssW; }
  }
}

/* ================== ÉCLAIRS ================== */
function drawLightning(){
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(0,0,cssW,cssH);
  const startX = cssW*0.65 + (Math.random()-0.5)*40;
  let x = startX, y = cssH*0.15;
  ctx.strokeStyle = 'rgba(255,255,200,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<6;i++){ x += (Math.random()<0.5?-1:1)*(12 + Math.random()*14); y += 20 + Math.random()*26; ctx.lineTo(x,y); }
  ctx.stroke();
}

/* ================== BOUCLE ================== */
function setScene(kind){
  anim.type=kind;
  if(kind==='rain' || kind==='drizzle' || kind==='thunder') { initRain(); }
  else if(kind==='snow') { initSnow(); }
}
function loop(){
  anim.t++;

  if(anim.type==='clear'){ paintSky('#89c7ea','#79b5d8'); }
  else if(anim.type==='clouds'){ paintSky('#7f93a5','#70859a'); }
  else if(['rain','drizzle','thunder'].includes(anim.type)){ paintSky('#5a6b76','#4d5e6a'); }
  else if(anim.type==='snow'){ paintSky('#b9d6f2','#a8c9ea'); }
  else { paintSky('#6b7280','#606872'); } // mist par défaut

  // nuages réalistes simplifiés
  if(anim.type!=='clear'){ drawClouds(); }

  // phénomènes
  if(anim.type==='rain' || anim.type==='drizzle'){ drawRain(); }
  else if(anim.type==='thunder'){ drawRain(); if(anim.t % 140 === 0) drawLightning(); }
  else if(anim.type==='snow'){ drawSnow(); }
  else if(anim.type==='mist'){ /* voile déjà inclus via paint/drawClouds */ }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================== WIDGET (données) ================== */
function toSceneFromMain(main){
  const m = (main||'').toLowerCase();
  if(m==='clear') return 'clear';
  if(m==='clouds') return 'clouds';
  if(m==='rain') return 'rain';
  if(m==='drizzle') return 'drizzle';
  if(m==='thunderstorm') return 'thunder';
  if(m==='snow') return 'snow';
  if(['mist','haze','fog','smoke','dust'].includes(m)) return 'mist';
  return 'clouds'; // fallback neutre
}

async function getWeather(){
  const url = `https://api.openweathermap.org/data/2.5/weather?lat=${CURRENT.lat}&lon=${CURRENT.lon}&units=metric&lang=fr&appid=${API_KEY}`;
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok){ throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    if(data.cod && String(data.cod) !== '200'){ throw new Error(data.message || `Code ${data.cod}`); }

    const weather = (data.weather && data.weather[0]) || {};
    const main = weather.main || '';
    const desc = weather.description || '—';

    $('city').textContent = CURRENT.name;
    $('temp').textContent = `${Math.round(data.main.temp)}°C`;
    $('desc').textContent = desc;
    $('wind').textContent = `${Math.round(((data.wind && data.wind.speed) ? data.wind.speed : 0)*3.6)} km/h`;
    $('humidity').textContent = `${data.main.humidity}%`;
    $('pressure').textContent = `${data.main.pressure} hPa`;

    const iconCode = weather.icon || '01d';
    const iconEl = $('icon');
    iconEl.src = W_ICON(iconCode);
    iconEl.alt = `Conditions : ${desc}`;
    iconEl.onerror = () => { iconEl.src = W_ICON('01d'); };

    $('updated').textContent = `Maj ${new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}`;

    // vent pour pluie (inclinaison)
    anim.wind.speed = (data.wind && data.wind.speed) ? data.wind.speed : 0; // m/s
    anim.wind.deg   = (data.wind && data.wind.deg)   ? data.wind.deg   : 0;

    setScene(toSceneFromMain(main));
  } catch(e){
    console.error(e);
    $('updated').textContent = `Erreur de mise à jour`;
    $('desc').textContent = `Impossible de récupérer la météo`;
    $('temp').textContent = '--°C';
    setScene('mist');
  }
}

/* ================== Sélection de ville ================== */
function setActiveChip(key){
  document.querySelectorAll('.chip').forEach(b=>{
    b.classList.toggle('active', b.dataset.city===key);
  });
}
function onCityClick(e){
  const key = e.target?.dataset?.city;
  if(!key || !CITY_COORDS[key]) return;
  CURRENT = { key, ...CITY_COORDS[key] };
  localStorage.setItem('cityKey', key);
  setActiveChip(key);
  getWeather();
}
document.getElementById('cities').addEventListener('click', onCityClick);

/* ================== Démarrage ================== */
setActiveChip(CURRENT.key);
getWeather();
</script>
</body>
