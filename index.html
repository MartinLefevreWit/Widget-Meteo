
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Widget Météo – Clear réaliste + nuages réalistes (amélioré)</title>
<style>
  html, body {
    margin:0; padding:0;
    background:#0f172a; color:#e5e7eb;
    font-family: system-ui, sans-serif;
    display:grid; place-items:center;
    min-height:100vh;
  }
  .widget {
    position: relative;
    width:100%; max-width:380px;
    border-radius:14px;
    background:rgba(15,23,42,0.85);
    border:1px solid #1f2937;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    overflow:hidden;
    backdrop-filter: blur(6px);
    box-sizing: border-box;
  }
  .bg-canvas {
    position:absolute; inset:0; z-index:0;
    width:100%; height:100%; display:block;
    pointer-events:none;
    backface-visibility: hidden;
  }

  .header, .main, .grid { position: relative; z-index: 1; }
  .header {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px;
    background:rgba(56,189,248,.08);
  }

  /* Lisibilité renforcée */
  .city, .updated, .temp, .desc {
    font-weight:600; color:#e5e7eb;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .updated { font-size:12px; font-weight:500; }

  .main {
    display:grid; grid-template-columns:1fr auto; gap:12px;
    padding:16px; min-height:160px;
  }
  .temp { font-size:42px; font-weight:700; opacity:.95; }
  .desc { font-size:18px; font-weight:500; opacity:.95; text-transform:capitalize; }
  .icon { width:72px; height:72px; }

  .grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    padding:0 16px 16px;
  }
  .card {
    background:rgba(17,24,39,.75);
    border-radius:12px; padding:12px; text-align:center;
  }
  .label { font-size:12px; color:#9ca3af; margin-bottom:6px; }
  .value { font-weight:700; color:#e2e8f0; text-shadow:0 1px 2px rgba(0,0,0,0.28); }
</style>
</head>
<body>
<div class="widget" id="widget">
  <canvas id="bg" class="bg-canvas"></canvas>

  <div class="header">
    <div class="city" id="city">Nice, FR</div>
    <div class="updated" id="updated">—</div>
  </div>

  <div class="main">
    <div>
      <div class="temp" id="temp">--°C</div>
      <div class="desc" id="desc">—</div>
    </div>
    <img class="icon" id="icon" alt="Icône météo" />
  </div>

  <div class="grid">
    <div class="card"><div class="label">Vent</div><div class="value" id="wind">—</div></div>
    <div class="card"><div class="label">Humidité</div><div class="value" id="humidity">—</div></div>
    <div class="card"><div class="label">Pression</div><div class="value" id="pressure">—</div></div>
  </div>
</div>

<script>
// ================== CONFIG ==================
const API_KEY = "f5f9a18a44029213156c7571d5b0d3f0"; // ⚠️ Démo — ne pas exposer en prod
const LAT = 43.7009358, LON = 7.2683912;
const W_ICON = (i) => `https://openweathermap.org/img/wn/${i}@2x.png`;

// ================== CANVAS ==================
const host = document.getElementById('widget');
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let cssW = 0, cssH = 0, dpr = 1;
function measureHost(){ cssW = host.clientWidth; cssH = host.clientHeight; dpr = window.devicePixelRatio || 1; }
function resizeCanvas(){
  measureHost();
  canvas.style.width = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width  = Math.ceil(cssW * dpr);
  canvas.height = Math.ceil(cssH * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(host);
window.addEventListener('resize', resizeCanvas);

// ================== ANIM STATE ==================
let anim = {
  type:'none',
  t:0,
  rain:[],
  snow:[],
  wind:{ speed:0, deg:0 }
};

// ================== OUTILS ==================
function $(id){ return document.getElementById(id); }

// ---------- JOUR/NUIT & PALETTE ----------
const SceneConfig = {
  clear:   { top:'#5fb3e7', mid:'#7cc5ee', bottom:'#9ad7ff', fog:0.00 },
  clouds:  { top:'#7490a6', mid:'#6b839b', bottom:'#6f879d', fog:0.10 },
  rain:    { top:'#586a76', mid:'#546671', bottom:'#4e5f6b', fog:0.18 },
  drizzle: { top:'#5e6f7b', mid:'#596a76', bottom:'#52636f', fog:0.14 },
  thunder: { top:'#3e4e58', mid:'#394851', bottom:'#33424b', fog:0.22 },
  snow:    { top:'#b6d2ef', mid:'#a9c9ea', bottom:'#a0c2e7', fog:0.16 },
  mist:    { top:'#6b7280', mid:'#656d79', bottom:'#606872', fog:0.20 },
};
let dayCycle = { hour: new Date().getHours(), sunX: 0, sunY: 0, sunR: 42, night: false };

function updateDayCycle(){
  const h = new Date().getHours();
  dayCycle.hour = h;
  const isDay = (h >= 6 && h <= 20);
  dayCycle.night = !isDay;
  const t = isDay ? (h - 6) / 14 : 0;
  dayCycle.sunX = cssW * (0.15 + 0.7*t);
  dayCycle.sunY = cssH * (0.25 - 0.12*Math.sin(t*Math.PI));
  dayCycle.sunR = 36 + 10*Math.sin(t*Math.PI);
}
function lerpColor(a,b,t){
  const ai=parseInt(a.slice(1),16), bi=parseInt(b.slice(1),16);
  const ar=(ai>>16)&255, ag=(ai>>8)&255, ab=ai&255;
  const br=(bi>>16)&255, bg=(bi>>8)&255, bb=bi&255;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), b2=Math.round(ab+(bb-ab)*t);
  return `rgb(${r},${g},${b2})`;
}
function paintSkyScene(){
  const cfg = SceneConfig[anim.type] || SceneConfig.clouds;
  const dayT = dayCycle.night ? 0 : 1;
  const top    = lerpColor(cfg.top,    '#58ace0', 0.15*dayT);
  const mid    = lerpColor(cfg.mid,    '#76c1ea', 0.10*dayT);
  const bottom = lerpColor(cfg.bottom, '#95d4ff', 0.10*dayT);
  const g = ctx.createLinearGradient(0,0,0,cssH);
  g.addColorStop(0, top); g.addColorStop(0.6, mid); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,cssW,cssH);
  const h = ctx.createLinearGradient(0, cssH*0.55, 0, cssH);
  h.addColorStop(0, 'rgba(255,255,255,0)');
  h.addColorStop(1, dayCycle.night ? 'rgba(200,220,255,0.08)' : 'rgba(255,255,255,0.15)');
  ctx.fillStyle = h; ctx.fillRect(0, cssH*0.55, cssW, cssH*0.45);
}
function drawSunMoon(){
  if(dayCycle.night){
    ctx.save(); ctx.globalAlpha = 0.65;
    for(let i=0;i<40;i++){
      const x = (i*97 % cssW), y = (i*37 % (cssH*0.6));
      const r = (i%7===0)?1.6:1.0;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    const moonX = cssW*0.78, moonY = cssH*0.20, r = 22;
    const grad = ctx.createRadialGradient(moonX, moonY, r*0.25, moonX, moonY, r);
    grad.addColorStop(0, 'rgba(220,235,255,1)'); grad.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(moonX, moonY, r, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalAlpha=0.18; ctx.filter='blur(1.6px)';
    ctx.beginPath(); ctx.arc(moonX, moonY, r+14, 0, Math.PI*2); ctx.fill();
    ctx.filter='none'; ctx.restore();
  } else {
    const t = anim.t;
    const sunX = dayCycle.sunX, sunY = dayCycle.sunY;
    const r    = dayCycle.sunR + Math.sin(t*0.02)*2.5;
    const grad = ctx.createRadialGradient(sunX, sunY, r*0.25, sunX, sunY, r);
    grad.addColorStop(0, 'rgba(255,245,200,1)'); grad.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(sunX, sunY, r, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalAlpha = 0.22; ctx.filter = 'blur(1.6px)';
    ctx.beginPath(); ctx.arc(sunX, sunY, r+18, 0, Math.PI*2); ctx.fill();
    ctx.filter='none'; ctx.restore();
  }
}

// ================== BRUIT (Perlin-like) + fBm ==================
const Noise = (() => {
  const perm = new Uint8Array(512);
  let seed = 20251222;
  function reseed(s){
    seed = s>>>0;
    for(let i=0;i<256;i++){ perm[i] = i; }
    for(let i=255;i>0;i--){
      seed = (seed*1664525 + 1013904223)>>>0;
      const j = (seed & 255) % (i+1);
      const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    for(let i=0;i<256;i++){ perm[i+256]=perm[i]; }
  }
  reseed(seed);
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const lerp = (a,b,t) => a + t*(b-a);
  function grad(h, x, y){
    const u = (h & 1) ? x : y;
    const v = (h & 2) ? -y : x;
    return ((h & 4) ? -u : u) + ((h & 8) ? -v : v);
  }
  function noise2d(x, y){
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[X + perm[Y]], ab = perm[X + perm[Y+1]];
    const ba = perm[X+1 + perm[Y]], bb = perm[X+1 + perm[Y+1]];
    const x1 = lerp(grad(aa, xf,   yf),   grad(ba, xf-1, yf),   u);
    const x2 = lerp(grad(ab, xf,   yf-1), grad(bb, xf-1, yf-1), u);
    return lerp(x1, x2, v); // ~[-1,1]
  }
  function fbm2d(x,y,oct=3){
    let amp=0.6, freq=1.0, sum=0, norm=0;
    for(let i=0;i<oct;i++){
      sum += (noise2d(x*freq, y*freq)*0.5+0.5) * amp;
      norm += amp;
      amp *= 0.55;
      freq *= 1.9;
    }
    return sum/norm; // [0,1]
  }
  return { fbm2d };
})();

// ================== NUAGES réalistes (offscreen + blur) ==================
const cloudLayers = [
  { baseScale: 2.8, detailMix: 0.25, threshold: 0.48, alpha: 0.80, evolveX: 0.010, evolveY: 0.004 }, // proche
  { baseScale: 3.6, detailMix: 0.20, threshold: 0.52, alpha: 0.60, evolveX: 0.006, evolveY: 0.002 }  // lointain
];
let cloudA=null, ctxA=null, cloudB=null, ctxB=null;
function ensureCloudCanvases(){
  const w = Math.max(140, Math.round(cssW*0.45)); // petite résolution => douceur
  const h = Math.max(105, Math.round(cssH*0.45));
  if(!cloudA){ cloudA=document.createElement('canvas'); ctxA=cloudA.getContext('2d'); }
  if(!cloudB){ cloudB=document.createElement('canvas'); ctxB=cloudB.getContext('2d'); }
  cloudA.width=w; cloudA.height=h;
  cloudB.width=w; cloudB.height=h;
}
const smoothstep = (a,b,x) => {
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
};
function renderLayer(offCtx, layer, time){
  const ow = offCtx.canvas.width, oh = offCtx.canvas.height;
  const img = offCtx.getImageData(0,0,ow,oh);
  const data = img.data;
  for(let y=0;y<oh;y++){
    const yy = y/oh;
    for(let x=0;x<ow;x++){
      const xx = x/ow;
      const nx = xx*layer.baseScale + time*layer.evolveX;
      const ny = yy*layer.baseScale + time*layer.evolveY;
      const base = Noise.fbm2d(nx, ny, 3);
      const cover = smoothstep(layer.threshold-0.10, layer.threshold+0.08, base);
      const det = Noise.fbm2d(nx*2.2, ny*2.2, 2);
      let a = cover * (0.65 + det*layer.detailMix);
      a = Math.pow(a, 1.15); a *= layer.alpha;
      const idx = (y*ow + x)*4;
      data[idx+0] = 246; data[idx+1] = 250; data[idx+2] = 255; // blanc bleuté
      data[idx+3] = Math.floor(a*255);
    }
  }
  offCtx.putImageData(img,0,0);
}

// ================== CLEAR SKY (Cirrus améliorés) ==================
let cirrusCanvas=null, cirrusCtx=null;
function ensureCirrusCanvas(){
  const w = Math.max(140, Math.round(cssW*0.50));
  const h = Math.max(95, Math.round(cssH*0.40));
  if(!cirrusCanvas){ cirrusCanvas=document.createElement('canvas'); cirrusCtx=cirrusCanvas.getContext('2d'); }
  cirrusCanvas.width=w; cirrusCanvas.height=h;
}
function renderCirrus(offCtx, time){
  const ow = offCtx.canvas.width, oh = offCtx.canvas.height;
  const img = offCtx.getImageData(0,0,ow,oh);
  const data = img.data;
  const scaleX = 4.2, scaleY = 1.4;
  const evoX = 0.014, evoY = 0.003;
  for(let y=0;y<oh;y++){
    const yy = y/oh;
    for(let x=0;x<ow;x++){
      const xx = x/ow;
      const nx = xx*scaleX + time*evoX;
      const ny = yy*scaleY + time*evoY;
      const base = Noise.fbm2d(nx, ny, 3);
      const det  = Noise.fbm2d(nx*2.0, ny*2.0, 2);
      let a = smoothstep(0.52, 0.60, base) * (0.55 + 0.25*det);
      a = Math.pow(a, 1.35);
      a *= 0.28;
      const idx = (y*ow + x)*4;
      data[idx+0] = 255; data[idx+1] = 255; data[idx+2] = 255;
      data[idx+3] = Math.floor(a*255);
    }
  }
  offCtx.putImageData(img,0,0);
}

// ---------- Nuages/ Cirrus Améliorés ----------
let cloudTick = 0;
function drawCloudsImproved(){
  ensureCloudCanvases();
  cloudTick++;
  const t = anim.t * 0.002;
  if(cloudTick % 6 === 0){ renderLayer(ctxB, cloudLayers[1], t*0.85); }
  if(cloudTick % 4 === 0){ renderLayer(ctxA, cloudLayers[0], t); }
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.filter = 'blur(1.0px)';
  const parB = Math.sin(t*0.07)*6;
  const parA = Math.sin(t*0.11)*9;
  ctx.drawImage(cloudB, parB, 0, cssW, cssH);
  ctx.drawImage(cloudA, parA, 0, cssW, cssH);
  ctx.filter = 'none';
  ctx.restore();
}
let cirrusTick = 0;
function drawCirrusImproved(){
  ensureCirrusCanvas();
  cirrusTick++;
  if(cirrusTick % 5 === 0){ renderCirrus(cirrusCtx, anim.t*0.0024); }
  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.filter = 'blur(0.8px)';
  ctx.drawImage(cirrusCanvas, 0, 0, cssW, cssH);
  ctx.filter = 'none';
  ctx.restore();
}

// ================== PLUIE ==================
function initRain(count=110){
  anim.rain.length = 0;
  const mps = anim.wind.speed || 0;
  const ang = ((anim.wind.deg||0) * Math.PI)/180;
  const windVX = Math.cos(ang) * mps;
  count = Math.round(count * (cssW/380) * (cssH/220));
  for(let i=0;i<count;i++){
    const len = 8 + Math.random()*14;
    const speed = 3.8 + Math.random()*4.8 + mps*0.5;
    const alpha = 0.45 + Math.random()*0.4;
    anim.rain.push({
      x: Math.random()*cssW, y: Math.random()*cssH,
      len, vy: speed,
      vx: windVX*0.7 + (Math.random()-0.5)*0.5,
      alpha, width: 1 + Math.random()*0.7
    });
  }
}
function drawRainImproved(){
  for(const d of anim.rain){
    ctx.strokeStyle = `rgba(160,200,255,${d.alpha})`;
    ctx.lineWidth   = d.width;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.vx*2, d.y + d.len);
    ctx.stroke();
    d.x += d.vx; d.y += d.vy;
    if(d.y > cssH-3){
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = 'rgba(180,210,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(d.x, cssH-2, 3.5, 1.2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      d.y = -d.len; d.x = Math.random()*cssW;
    }
    if(d.x < -20 || d.x > cssW+20){ d.y = -d.len; d.x = Math.random()*cssW; }
  }
  const ref = ctx.createLinearGradient(cssW*0.1, cssH-8, cssW*0.9, cssH);
  ref.addColorStop(0, 'rgba(180,200,220,0.06)');
  ref.addColorStop(1, 'rgba(180,200,220,0.00)');
  ctx.fillStyle = ref; ctx.fillRect(cssW*0.1, cssH-10, cssW*0.8, 10);
}

// ================== NEIGE ==================
function initSnow(count=85){
  anim.snow.length = 0;
  count = Math.round(count * (cssW/380) * (cssH/220));
  for(let i=0;i<count;i++){
    const r  = 1.6 + Math.random()*3.2;
    const vy = 0.9 + Math.random()*1.6;
    const swayAmp = 8 + Math.random()*16;
    const swayFreq = 0.0018 + Math.random()*0.0035;
    const blur = Math.random() < 0.35 ? 2 : 0;
    anim.snow.push({
      x: Math.random()*cssW, y: Math.random()*cssH,
      r, vy, baseX: Math.random()*cssW,
      swayAmp, swayFreq, phase: Math.random()*Math.PI*2,
      blur, alpha: 0.6 + Math.random()*0.3
    });
  }
}
function drawSnowImproved(){
  const ang = ((anim.wind.deg||0) * Math.PI)/180;
  const windVX = Math.cos(ang) * (anim.wind.speed||0) * 0.6;
  for(const f of anim.snow){
    f.phase += f.swayFreq * (1 + f.vy*0.08);
    f.x = f.baseX + Math.sin(f.phase) * f.swayAmp + windVX*0.8;

    ctx.shadowColor = `rgba(255,255,255,${f.alpha})`;
    ctx.shadowBlur  = f.blur;

    const gr = ctx.createRadialGradient(f.x, f.y, f.r*0.25, f.x, f.y, f.r);
    gr.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
    gr.addColorStop(1, `rgba(255,255,255,${Math.max(0.35, f.alpha-0.3)})`);
    ctx.fillStyle = gr;

    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    f.y += f.vy;
    if(f.y > cssH){ f.y = -f.r; f.baseX = Math.random()*cssW; }
  }
  const acc = ctx.createLinearGradient(0, cssH-20, 0, cssH);
  acc.addColorStop(0, 'rgba(255,255,255,0.06)');
  acc.addColorStop(1, 'rgba(255,255,255,0.14)');
  ctx.fillStyle = acc; ctx.fillRect(0, cssH-20, cssW, 20);
}

// ================== ÉCLAIRS ==================
let thunderFlash = 0;
function drawLightningImproved(){
  thunderFlash = 0.22; // intensité initiale
  const branches = 1 + Math.floor(Math.random()*2);
  for(let b=0; b<branches; b++){
    const startX = cssW*0.65 + (Math.random()-0.5)*60;
    let x = startX, y = cssH*0.12;
    ctx.strokeStyle = 'rgba(255,255,200,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x,y);
    const segs = 6 + Math.floor(Math.random()*4);
    for(let i=0;i<segs;i++){
      x += (Math.random()<0.5?-1:1)*(12 + Math.random()*16);
      y += 18 + Math.random()*28;
      ctx.lineTo(x,y);
      if(Math.random()<0.28){
        ctx.moveTo(x,y);
        const x2 = x + (Math.random()<0.5?-1:1)*(8+Math.random()*12);
        const y2 = y + 8 + Math.random()*14;
        ctx.lineTo(x2,y2);
      }
    }
    ctx.stroke();
  }
}
function applyThunderFlash(){
  if(thunderFlash > 0){
    ctx.fillStyle = `rgba(255,255,255,${thunderFlash})`;
    ctx.fillRect(0,0,cssW,cssH);
    thunderFlash = Math.max(0, thunderFlash - 0.02); // decay
  }
}

// ---------- VOILE / VIGNETTE ----------
function integrateFogAndVignette(){
  const fog = SceneConfig[anim.type]?.fog ?? 0.12;
  if(anim.type!=='clear'){
    const g = ctx.createLinearGradient(0,0,0,cssH);
    g.addColorStop(0, `rgba(220,230,235,${fog*0.4})`);
    g.addColorStop(0.5, `rgba(220,230,235,${fog})`);
    g.addColorStop(1, `rgba(220,230,235,${fog*0.4})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,cssW,cssH);
  }
  const vg = ctx.createRadialGradient(cssW*0.5, cssH*0.5, cssH*0.35, cssW*0.5, cssH*0.5, cssH*0.65);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.10)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,cssW,cssH);
}

// ================== BOUCLE ==================
function loop(){
  anim.t++;
  updateDayCycle();
  paintSkyScene();

  // Décor
  if(anim.type==='clear'){
    drawSunMoon();
    drawCirrusImproved();
  } else {
    drawSunMoon();          // lune de nuit, soleil discret en jour (selon cycle)
    drawCloudsImproved();
  }

  // Phénomènes
  if(anim.type==='rain' || anim.type==='drizzle'){
    drawRainImproved();
  } else if(anim.type==='thunder'){
    drawRainImproved();
    if(anim.t % 140 === 0 || Math.random()<0.006){
      drawLightningImproved();
    }
    applyThunderFlash();
  } else if(anim.type==='snow'){
    drawSnowImproved();
  }

  integrateFogAndVignette();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================== WIDGET (données) ==================
function toSceneFromMain(main){
  const m = (main||'').toLowerCase();
  if(m==='clear') return 'clear';
  if(m==='clouds') return 'clouds';
  if(m==='rain') return 'rain';
  if(m==='drizzle') return 'drizzle';
  if(m==='thunderstorm') return 'thunder';
  if(m==='snow') return 'snow';
  if(['mist','haze','fog','smoke','dust'].includes(m)) return 'mist';
  return 'clouds';
}
function setScene(kind){
  anim.type=kind;
  if(kind==='rain' || kind==='drizzle' || kind==='thunder'){
    const base = kind==='drizzle' ? 70 : (kind==='thunder' ? 150 : 110);
    initRain(base);
  } else if(kind==='snow'){ initSnow(85); }
}

async function getWeather(){
  const url = `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&units=metric&lang=fr&appid=${API_KEY}`;
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok){ throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    if(data.cod && String(data.cod) !== '200'){ throw new Error(data.message || `Code ${data.cod}`); }

    const weather = (data.weather && data.weather[0]) || {};
    const main = weather.main || '';
    const desc = weather.description || '—';

    $('temp').textContent = `${Math.round(data.main.temp)}°C`;
    $('desc').textContent = desc;
    $('wind').textContent = `${Math.round(((data.wind && data.wind.speed) ? data.wind.speed : 0)*3.6)} km/h`;
    $('humidity').textContent = `${data.main.humidity}%`;
    $('pressure').textContent = `${data.main.pressure} hPa`;

    const iconCode = weather.icon || '01d';
    const iconEl = $('icon');
    iconEl.src = W_ICON(iconCode);
    iconEl.alt = `Conditions : ${desc}`;
    iconEl.onerror = () => { iconEl.src = W_ICON('01d'); };

    $('updated').textContent = `Maj ${new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}`;

    anim.wind.speed = (data.wind && data.wind.speed) ? data.wind.speed : 0; // m/s
    anim.wind.deg   = (data.wind && data.wind.deg)   ? data.wind.deg   : 0;

    setScene(toSceneFromMain(main));
    const cityName = (data.name || 'Nice');
    const country  = ((data.sys && data.sys.country) || 'FR');
    $('city').textContent = `${cityName}, ${country}`;
  } catch(e){
    console.error(e);
    $('updated').textContent = `Erreur de mise à jour`;
    $('desc').textContent = `Impossible de récupérer la météo`;
    $('temp').textContent = '--°C';
    setScene('mist');
    $('city').textContent = 'Nice, FR';
  }
}

// Lancer
getWeather();
</script>
