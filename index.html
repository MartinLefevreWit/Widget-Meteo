
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Widget Météo – Nice (OpenWeather)</title>
  <meta name="description" content="Widget météo simple (OpenWeather) – température, vent, humidité, description." />
  <style>
    :root {
      --bg: #0f172a; --panel: #111827; --text: #e5e7eb; --muted: #9ca3af;
      --accent: #38bdf8; --radius: 14px; --shadow: 0 10px 25px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", sans-serif; }
    .wrapper { padding:12px; min-height:100dvh; display:grid; place-items:center; }
    .widget { width:100%; max-width:380px; border-radius:var(--radius);
      background: linear-gradient(180deg,#0b1220 0%,#0f172a 100%);
      border:1px solid #1f2937; box-shadow:var(--shadow); overflow:hidden; }
    .header { display:flex; align-items:center; gap:12px; padding:14px 16px;
      background: rgba(56,189,248,.08); border-bottom:1px solid #1f2937; }
    .city { font-weight:600; letter-spacing:.2px; }
    .updated { margin-left:auto; font-size:12px; color:var(--muted); }
    .main { display:grid; grid-template-columns:1fr auto; gap:12px; padding:16px; }
    .temp { font-size:42px; font-weight:700; line-height:1; }
    .desc { margin-top:4px; color:var(--muted); text-transform:capitalize; }
    .icon { width:72px; height:72px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px 16px; }
    .card { background:var(--panel); border:1px solid #1f2937; border-radius:12px; padding:12px; text-align:center; }
    .label { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .value { font-weight:600; }
    .error { padding:14px 16px; color:#ef4444; background:rgba(239,68,68,.08);
      border-top:1px solid rgba(239,68,68,.3); font-size:14px; display:none; }
    .footer { padding:10px 16px; font-size:12px; color:var(--muted); border-top:1px solid #1f2937; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="widget" role="region" aria-label="Widget météo">
      <div class="header">
        <div class="city" id="city">Nice, FR</div>
        <div class="updated" id="updated">—</div>
      </div>

      <div class="main">
        <div>
          <div class="temp" id="temp">--°C</div>
          <div class="desc" id="desc">—</div>
        </div>
        <img class="icon" id="icon" alt="Icône météo" />
      </div>

      <div class="grid" aria-label="Détails météo">
        <div class="card">
          <div class="label">Vent</div>
          <div class="value" id="wind">—</div>
        </div>
        <div class="card">
          <div class="label">Humidité</div>
          <div class="value" id="humidity">—</div>
        </div>
        <div class="card">
          <div class="label">Pression</div>
          <div class="value" id="pressure">—</div>
        </div>
      </div>

      <div class="error" id="error"></div>
      <div class="footer">
        Source : <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeather</a>
      </div>
    </div>
  </div>

  <script type="module">
    // =============== CONFIG ===============
    const CITY = "Nice";
    const COUNTRY = "FR";
    const LAT = 43.7009;
    const LON = 7.2683;

    // 1) Mode direct OpenWeather (clé exposée côté client)
    const API_KEY = "https://api.openweathermap.org/data/2.5/weather?q=Nice,FR&units=metric&lang=fr&appid=f5f9a18a44029213156c7571d5b0d3f0"; // <--- remplace
    const USE_PROXY = false;

    // 2) Si tu actives un proxy serverless (section 3), mets true et configure PROXY_URL
    const PROXY_URL = "/.netlify/functions/openweather-proxy"; // ou ton URL Cloudflare Worker

    // Cache local (10 min)
    const TTL_MS = 10 * 60 * 1000;

    // =============== HELPERS UI ===============
    const $ = (id) => document.getElementById(id);
    const showError = (msg) => { const el = $('error'); el.textContent = msg; el.style.display = 'block'; };
    const formatTime = (d = new Date()) => new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' }).format(d);

    function owmIconUrl(icon) {
      return `https://openweathermap.org/img/wn/${icon}@2x.png`;
    }

    // =============== FETCH ===============
    function buildUrl() {
      if (USE_PROXY) {
        // Le proxy lit lat/lon et injecte la clé côté serveur
        const url = new URL(PROXY_URL, location.origin);
        url.searchParams.set("lat", LAT);
        url.searchParams.set("lon", LON);
        url.searchParams.set("units", "metric");
        url.searchParams.set("lang", "fr");
        return url.toString();
      }
      // Appel direct (clé visible)
      const url = new URL("https://api.openweathermap.org/data/2.5/weather");
      url.searchParams.set("lat", LAT);
      url.searchParams.set("lon", LON);
      url.searchParams.set("units", "metric");
      url.searchParams.set("lang", "fr");
      url.searchParams.set("appid", API_KEY);
      return url.toString();
    }

    async function getWeather() {
      const cacheKey = `owm:${LAT},${LON}:weather`;
      const cachedRaw = localStorage.getItem(cacheKey);
      if (cachedRaw) {
        try {
          const cached = JSON.parse(cachedRaw);
          if (Date.now() - cached.ts < TTL_MS) return cached.data;
        } catch {}
      }

      const url = buildUrl();
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {
