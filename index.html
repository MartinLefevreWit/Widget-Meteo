
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Widget Météo – Nuages réalistes (volumes doux, pas de grain)</title>
<style>
  html, body {
    margin:0; padding:0;
    background:#0f172a; color:#e5e7eb;
    font-family: system-ui, sans-serif;
    display:grid; place-items:center;
    min-height:100vh;
  }
  .widget {
    position: relative;
    width:100%; max-width:380px;
    border-radius:14px;
    background:rgba(15,23,42,0.85);
    border:1px solid #1f2937;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    overflow:hidden;
    backdrop-filter: blur(6px);
    box-sizing: border-box;
  }
  .bg-canvas {
    position:absolute; inset:0; z-index:0;
    width:100%; height:100%; display:block;
    pointer-events:none;
    backface-visibility: hidden;
  }
  .header, .main, .grid { position: relative; z-index: 1; }
  .header {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px;
    background:rgba(56,189,248,.08);
  }
  .city { font-weight:600; }
  .updated { font-size:12px; color:#9ca3af; }
  .main {
    display:grid; grid-template-columns:1fr auto; gap:12px;
    padding:16px; min-height:160px;
  }
  .temp { font-size:42px; font-weight:700; opacity:.95; }
  .desc { color:#e5e7eb; opacity:.85; text-transform:capitalize; }
  .icon { width:72px; height:72px; }
  .grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    padding:0 16px 16px;
  }
  .card {
    background:rgba(17,24,39,.75);
    border-radius:12px; padding:12px; text-align:center;
  }
  .label { font-size:12px; color:#9ca3af; margin-bottom:6px; }
  .value { font-weight:700; }
</style>
</head>
<body>
<div class="widget" id="widget">
  <canvas id="bg" class="bg-canvas"></canvas>

  <div class="header">
    <div class="city" id="city">Nice, FR</div>
    <div class="updated" id="updated">—</div>
  </div>

  <div class="main">
    <div>
      <div class="temp" id="temp">--°C</div>
      <div class="desc" id="desc">—</div>
    </div>
    <img class="icon" id="icon" alt="Icône météo" />
  </div>

  <div class="grid">
    <div class="card"><div class="label">Vent</div><div class="value" id="wind">—</div></div>
    <div class="card"><div class="label">Humidité</div><div class="value" id="humidity">—</div></div>
    <div class="card"><div class="label">Pression</div><div class="value" id="pressure">—</div></div>
  </div>
</div>

<script>
// ================== CONFIG ==================
const API_KEY = "f5f9a18a44029213156c7571d5b0d3f0"; // ⚠️ Démo — ne pas exposer en prod
const LAT = 43.7009, LON = 7.2683;
const W_ICON = (i) => `https://openweathermap.org/img/wn/${i}@2x.png`;

// ================== CANVAS ==================
const host = document.getElementById('widget');
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let cssW = 0, cssH = 0, dpr = 1;
function measureHost(){ cssW = host.clientWidth; cssH = host.clientHeight; dpr = window.devicePixelRatio || 1; }
function resizeCanvas(){
  measureHost();
  canvas.style.width = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width  = Math.ceil(cssW * dpr);
  canvas.height = Math.ceil(cssH * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(host);
window.addEventListener('resize', resizeCanvas);

// ================== ANIM STATE ==================
let anim = {
  type:'none',
  t:0,
  rain:[],
  snow:[],
  wind:{ speed:0, deg:0 }
};

// ================== OUTILS ==================
function $(id){ return document.getElementById(id); }
function paintSky(colorA='#89c7ea', colorB='#79b5d8'){
  const g = ctx.createLinearGradient(0,0,0,cssH);
  g.addColorStop(0, colorA);
  g.addColorStop(1, colorB);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,cssW,cssH);
}

// ================== BRUIT (Perlin-like) + fBm ==================
const Noise = (() => {
  const perm = new Uint8Array(512);
  let seed = 20251222;
  function reseed(s){
    seed = s>>>0;
    for(let i=0;i<256;i++){ perm[i] = i; }
    // Fisher-Yates
    for(let i=255;i>0;i--){
      seed = (seed*1664525 + 1013904223)>>>0;
      const j = (seed & 255) % (i+1);
      const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    for(let i=0;i<256;i++){ perm[i+256]=perm[i]; }
  }
  reseed(seed);
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const lerp = (a,b,t) => a + t*(b-a);
  function grad(h, x, y){
    const u = (h & 1) ? x : y;
    const v = (h & 2) ? -y : x;
    return ((h & 4) ? -u : u) + ((h & 8) ? -v : v);
  }
  function noise2d(x, y){
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[X + perm[Y]], ab = perm[X + perm[Y+1]];
    const ba = perm[X+1 + perm[Y]], bb = perm[X+1 + perm[Y+1]];
    const x1 = lerp(grad(aa, xf,   yf),   grad(ba, xf-1, yf),   u);
    const x2 = lerp(grad(ab, xf,   yf-1), grad(bb, xf-1, yf-1), u);
    return lerp(x1, x2, v); // ~[-1,1]
  }
  function fbm2d(x,y,oct=3){
    let amp=0.6, freq=1.0, sum=0, norm=0;
    for(let i=0;i<oct;i++){
      sum += (noise2d(x*freq, y*freq)*0.5+0.5) * amp;
      norm += amp;
      amp *= 0.55;
      freq *= 1.9;
    }
    return sum/norm; // [0,1]
  }
  return { fbm2d, reseed };
})();

// ================== NUAGES réalistes (offscreen basse résolution + blur) ==================
const cloudLayers = [
  // proche : masses plus larges
  { baseScale: 2.8, detailMix: 0.25, threshold: 0.48, alpha: 0.80, evolveX: 0.010, evolveY: 0.004 },
  // lointain : un peu plus diffus
  { baseScale: 3.6, detailMix: 0.20, threshold: 0.52, alpha: 0.60, evolveX: 0.006, evolveY: 0.002 }
];

let cloudA=null, ctxA=null, cloudB=null, ctxB=null;

function ensureCloudCanvases(){
  // volontairement petit pour éviter le grain
  const w = Math.max(140, Math.round(cssW*0.45));
  const h = Math.max(105, Math.round(cssH*0.45));
  if(!cloudA){ cloudA=document.createElement('canvas'); ctxA=cloudA.getContext('2d'); }
  if(!cloudB){ cloudB=document.createElement('canvas'); ctxB=cloudB.getContext('2d'); }
  cloudA.width=w; cloudA.height=h;
  cloudB.width=w; cloudB.height=h;
}

const smoothstep = (a,b,x) => {
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
};

function renderLayer(offCtx, layer, time){
  const ow = offCtx.canvas.width, oh = offCtx.canvas.height;
  const img = offCtx.getImageData(0,0,ow,oh);
  const data = img.data;

  for(let y=0;y<oh;y++){
    const yy = y/oh;
    for(let x=0;x<ow;x++){
      const xx = x/ow;

      // échelle globale (peu de structures sur la largeur => gros volumes)
      const nx = xx*layer.baseScale + time*layer.evolveX;
      const ny = yy*layer.baseScale + time*layer.evolveY;

      const base = Noise.fbm2d(nx, ny, 3); // [0..1]
      const cover = smoothstep(layer.threshold-0.10, layer.threshold+0.08, base);

      // léger relief interne
      const det = Noise.fbm2d(nx*2.2, ny*2.2, 2);
      let a = cover * (0.65 + det*layer.detailMix);
      a = Math.pow(a, 1.15);             // bords adoucis
      a *= layer.alpha;

      // teinte (blanc très légèrement bleuté)
      const idx = (y*ow + x)*4;
      data[idx+0] = 246;
      data[idx+1] = 250;
      data[idx+2] = 255;
      data[idx+3] = Math.floor(a*255);
    }
  }
  offCtx.putImageData(img,0,0);
}

function drawClouds(){
  ensureCloudCanvases();

  // temps très lent (évolution, pas translation)
  const t = anim.t * 0.002;

  renderLayer(ctxB, cloudLayers[1], t*0.85);
  renderLayer(ctxA, cloudLayers[0], t);

  // dessin avec blur léger pour casser tout résidu de grain
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.filter = 'blur(1.2px)';
  ctx.globalAlpha = 1.0;
  ctx.drawImage(cloudB, 0, 0, cssW, cssH);
  ctx.drawImage(cloudA, 0, 0, cssW, cssH);
  ctx.filter = 'none';
  ctx.restore();
}

// ================== PLUIE ==================
function initRain(count=110){
  anim.rain.length = 0;
  const mps = anim.wind.speed || 0;
  const ang = ((anim.wind.deg||0) * Math.PI)/180;
  const windVX = Math.cos(ang) * mps;

  count = Math.round(count * (cssW/380) * (cssH/220));
  for(let i=0;i<count;i++){
    const len = 8 + Math.random()*14;
    const speed = 3.8 + Math.random()*4.8 + mps*0.5;
    const alpha = 0.45 + Math.random()*0.4;
    anim.rain.push({
      x: Math.random()*cssW,
      y: Math.random()*cssH,
      len,
      vy: speed,
      vx: windVX*0.7 + (Math.random()-0.5)*0.5,
      alpha,
      width: 1 + Math.random()*0.7
    });
  }
}
function drawRain(){
  for(const d of anim.rain){
    ctx.strokeStyle = `rgba(160,200,255,${d.alpha})`;
    ctx.lineWidth   = d.width;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.vx*2, d.y + d.len);
    ctx.stroke();

    d.x += d.vx; d.y += d.vy;
    if(d.y > cssH || d.x < -20 || d.x > cssW+20){ d.y = -d.len; d.x = Math.random()*cssW; }
  }
}

// ================== NEIGE ==================
function initSnow(count=85){
  anim.snow.length = 0;
  count = Math.round(count * (cssW/380) * (cssH/220));
  for(let i=0;i<count;i++){
    const r  = 1.6 + Math.random()*3.2;
    const vy = 0.9 + Math.random()*1.6;
    const swayAmp = 8 + Math.random()*16;
    const swayFreq = 0.0018 + Math.random()*0.0035;
    const blur = Math.random() < 0.35 ? 2 : 0;

    anim.snow.push({
      x: Math.random()*cssW,
      y: Math.random()*cssH,
      r, vy,
      baseX: Math.random()*cssW,
      swayAmp, swayFreq, phase: Math.random()*Math.PI*2,
      blur,
      alpha: 0.6 + Math.random()*0.3
    });
  }
}
function drawSnow(){
  for(const f of anim.snow){
    f.phase += f.swayFreq * (1 + f.vy*0.08);
    f.x = f.baseX + Math.sin(f.phase) * f.swayAmp;

    ctx.shadowColor = `rgba(255,255,255,${f.alpha})`;
    ctx.shadowBlur  = f.blur;

    const gr = ctx.createRadialGradient(f.x, f.y, f.r*0.25, f.x, f.y, f.r);
    gr.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
    gr.addColorStop(1, `rgba(255,255,255,${Math.max(0.35, f.alpha-0.3)})`);
    ctx.fillStyle = gr;

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    f.y += f.vy;
    if(f.y > cssH){ f.y = -f.r; f.baseX = Math.random()*cssW; }
  }
}

// ================== BOUCLE ==================
function setScene(kind){
  anim.type=kind;
  if(kind==='rain' || kind==='drizzle' || kind==='thunder') initRain();
  else if(kind==='snow') initSnow();
}
function loop(){
  anim.t++;

  if(anim.type==='clear'){ paintSky('#89c7ea','#79b5d8'); }
  else if(anim.type==='clouds'){ paintSky('#7f93a5','#70859a'); }
  else if(['rain','drizzle','thunder'].includes(anim.type)){ paintSky('#5a6b76','#4d5e6a'); }
  else if(anim.type==='snow'){ paintSky('#b9d6f2','#a8c9ea'); }
  else { paintSky('#6b7280','#606872'); }

  // nuages + phénomènes
  drawClouds();
  if(anim.type==='rain' || anim.type==='drizzle'){ drawRain(); }
  else if(anim.type==='thunder'){ drawRain(); if(anim.t % 140 === 0){ ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(0,0,cssW,cssH); } }
  else if(anim.type==='snow'){ drawSnow(); }
  if(anim.type!=='clear'){ // légère brume intégratrice
    const g = ctx.createLinearGradient(0,0,0,cssH);
    g.addColorStop(0, 'rgba(220,230,235,0.08)');
    g.addColorStop(0.5, 'rgba(220,230,235,0.14)');
    g.addColorStop(1, 'rgba(220,230,235,0.08)');
    ctx.fillStyle = g; ctx.fillRect(0,0,cssW,cssH);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================== WIDGET (données) ==================
function toSceneFromMain(main){
  const m = (main||'').toLowerCase();
  if(m==='clear') return 'clear';
  if(m==='clouds') return 'clouds';
  if(m==='rain') return 'rain';
  if(m==='drizzle') return 'drizzle';
  if(m==='thunderstorm') return 'thunder';
  if(m==='snow') return 'snow';
  if(['mist','haze','fog','smoke','dust'].includes(m)) return 'mist';
  return 'clouds';
}

async function getWeather(){
  const url = `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&units=metric&lang=fr&appid=${API_KEY}`;
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok){ throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    if(data.cod && String(data.cod) !== '200'){ throw new Error(data.message || `Code ${data.cod}`); }

    const weather = (data.weather && data.weather[0]) || {};
    const main = weather.main || '';
    const desc = weather.description || '—';

    $('temp').textContent = `${Math.round(data.main.temp)}°C`;
    $('desc').textContent = desc;
    $('wind').textContent = `${Math.round(((data.wind && data.wind.speed) ? data.wind.speed : 0)*3.6)} km/h`;
    $('humidity').textContent = `${data.main.humidity}%`;
    $('pressure').textContent = `${data.main.pressure} hPa`;

    const iconCode = weather.icon || '01d';
    const iconEl = $('icon');
    iconEl.src = W_ICON(iconCode);
    iconEl.alt = `Conditions : ${desc}`;
    iconEl.onerror = () => { iconEl.src = W_ICON('01d'); };

    $('updated').textContent = `Maj ${new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}`;

    anim.wind.speed = (data.wind && data.wind.speed) ? data.wind.speed : 0;
    anim.wind.deg   = (data.wind && data.wind.deg)   ? data.wind.deg   : 0;

    setScene(toSceneFromMain(main));
  } catch(e){
    console.error(e);
    $('updated').textContent = `Erreur de mise à jour`;
    $('desc').textContent = `Impossible de récupérer la météo`;
       $('temp').textContent = '--°C';
    setScene('mist');
  }
}

// Lancer
getWeather();
</script>
</body>
